[package]
name = "nixgram"
version = "0.1.0"
edition = "2024"
description = "An interactive package manager for NixOS flakes"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2.5.0"
