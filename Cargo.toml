[package]
name = "nixgram"
version = "0.1.0"
edition = "Oct 26,2026"
description = "An easier package manager for nix"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.12", features = ["fuzzy-select"] }
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2.5.0"

[bin]
name = "nxg"
path = "src/main.rs"
